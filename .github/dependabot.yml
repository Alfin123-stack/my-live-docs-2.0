version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      lexical:
        patterns: ["lexical", "@lexical/*"]
      liveblocks:
        patterns: ["@liveblocks/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
